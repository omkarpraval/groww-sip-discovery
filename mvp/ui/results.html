<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E2A2B;--pine:#1F4A4B;--muted:#5C6F6E;--line:#D3DDDA;--card:#fff;--ver:#D55E00;--verd:#A84700;--vbg:#F8E4D6;--grn:#009E73;--grnd:#00704F;--gbg:#DDF1E9;--amb:#E69F00;--abg:#FCEFD0;
--disp:'Bricolage Grotesque','Bricolage Grotesque 96pt ExtraBold',Inter,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:580px;margin:0 auto;padding:2px 2px 8px}
/* summary: the red card */
.sum{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:16px 18px 14px;position:relative;overflow:hidden}
.sum:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ver)}
.sum.upc:before{background:var(--grn)}
.sum .who{font-size:.8rem;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .loss{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum .loss .v{font-family:var(--disp);font-weight:800;font-size:2.7rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum .loss .v.down{color:var(--ver)}.sum .loss .v.up{color:var(--grnd)}
.sum .loss .lbl{font-weight:600;color:var(--pine)}
.sum .row{display:flex;gap:22px;margin-top:10px}
.sum .row small{display:block;font-size:.76rem;color:var(--muted)}
.sum .row .v{font-family:var(--disp);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.sum .foot{font-size:.78rem;color:var(--muted);margin-top:6px}
/* stepper: stations on a line */
.steps{position:relative;display:flex;justify-content:space-between;margin:18px 6px 14px}
.steps:before{content:"";position:absolute;left:42px;right:42px;top:17px;border-top:3px dotted #B9C7C3}
.prog{position:absolute;left:42px;top:16px;height:4px;background:var(--ink);border-radius:2px;transition:width .45s ease;width:0}
.chip{position:relative;z-index:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0;width:84px;font-size:.74rem;font-weight:600;color:var(--muted)}
.chip .n{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid #B9C7C3;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:1rem;color:var(--muted);transition:all .25s}
.chip.on{color:var(--ink)}
.chip.on .n{background:var(--ink);border-color:var(--ink);color:#fff;transform:scale(1.12);box-shadow:0 0 0 6px rgba(14,42,43,.12)}
.chip.done .n{background:var(--gbg);border-color:var(--grn);color:var(--grnd)}
.chip:focus-visible .n{outline:3px solid var(--grn);outline-offset:2px}
.stage{position:relative}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:18px 18px 16px;display:none}
.card.show{display:block;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.q{font-size:.8rem;color:var(--grnd);font-weight:700}
h2{font-family:var(--disp);font-size:1.45rem;font-weight:800;letter-spacing:-.015em;margin:2px 0 12px;line-height:1.15}
p.a{font-size:1.02rem;line-height:1.6;margin:12px 0 0}
.cap{font-size:.82rem;color:var(--muted);line-height:1.45}
/* people */
.people{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 6px}
.person{width:28px;height:36px;opacity:0;transform:translateY(6px);animation:pop .4s forwards}
@keyframes pop{to{opacity:1;transform:none}}
.person circle,.person path{fill:#CCD7D4}
.person.hit circle,.person.hit path{fill:var(--ver)}
.person.up circle,.person.up path{fill:var(--grn)}
.person.faint circle,.person.faint path{fill:#F2C4A6}
/* bars */
.bars{margin:6px 0}
.br{margin:12px 0}
.br .t{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:5px}
.br .t b{font-family:var(--disp);font-variant-numeric:tabular-nums}
.track{height:18px;background:#EDF2F0;border-radius:9px;position:relative}
.fill{position:absolute;top:0;height:18px;border-radius:9px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1),left .9s cubic-bezier(.2,.8,.2,1)}
.mid{position:absolute;left:50%;top:-6px;width:3px;height:30px;background:var(--ink);border-radius:2px}
.legend{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:2px}
/* time machine */
.tm{background:#F7FAF8;border:1.5px solid var(--line);border-radius:18px;padding:10px 10px 8px;margin-top:4px}
.tm svg{width:100%;height:auto;display:block}
.tmtop{display:flex;align-items:center;gap:8px;margin:8px 2px 4px}
.play{border:0;background:var(--ink);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:.9rem;flex:none}
input[type=range]{flex:1;accent-color:var(--ink);height:28px}
.mlabel{font-family:var(--disp);font-weight:800;font-size:.95rem;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
.read{min-height:64px;background:var(--gbg);border-radius:12px;padding:10px 12px;font-size:.93rem;line-height:1.45;margin-top:6px}
.read b{color:var(--grnd)}
.seg{display:inline-flex;background:#E1E9E6;border-radius:10px;padding:3px;margin-top:8px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* options */
.opt{border:1.5px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;background:#fff}
.opt>button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;box-sizing:border-box}
.opt>button:focus-visible{outline:3px solid var(--grn);outline-offset:-3px;border-radius:16px}
.opt .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.opt .ic svg{width:20px;height:20px}
.opt .tt{font-weight:700}.opt .sub{font-size:.82rem;color:var(--muted)}
.opt .chev{margin-left:auto;transition:transform .25s;color:var(--muted)}
.opt.open .chev{transform:rotate(90deg)}
.opt .body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 14px}
.opt.open .body{max-height:200px;padding:0 14px 14px}
.opt .body div{font-size:.92rem;line-height:1.5}
.how{margin-top:12px;border:1.5px dashed #B9C7C3;border-radius:12px;padding:0 12px;background:#FAFCFB}
.how summary{cursor:pointer;font-size:.84rem;font-weight:700;color:var(--grnd);padding:9px 0;list-style:none}
.how summary::-webkit-details-marker{display:none}
.how summary:before{content:"+ ";}.how[open] summary:before{content:"− ";}
.how div{font-size:.85rem;line-height:1.55;color:var(--muted);padding:0 0 10px}
.banner{background:var(--abg);border:1.5px dashed var(--amb);border-radius:12px;padding:9px 12px;font-size:.85rem;line-height:1.45;margin-top:10px}
.pin{display:flex;gap:6px;align-items:center;font-size:.8rem;font-weight:700;color:var(--ink);background:var(--abg);border-radius:10px;padding:6px 10px;margin:2px 0 6px}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:.8rem;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.cmp th,.cmp td{padding:8px 7px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.cmp tr:last-child td{border-bottom:0}
.cmp th{background:#EEF3F1;font-weight:700}.cmp th:nth-child(2){background:var(--gbg)}.cmp td:first-child{color:var(--muted);font-weight:600;width:24%}
.cmp .warn{color:var(--verd);font-weight:600}
.afford{background:var(--gbg);border-radius:12px;padding:10px 12px;font-size:.9rem;line-height:1.45;margin:10px 0 2px}
/* glossary */
.term{all:unset;cursor:help;border-bottom:2px dotted var(--grn);font-weight:600;color:inherit}
.term:focus-visible{outline:2px solid var(--grn)}
.tip{position:fixed;z-index:9;max-width:260px;background:var(--ink);color:#fff;font-size:.85rem;line-height:1.45;padding:10px 12px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{color:#8FD9C0}
/* nav + badge */
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;border:0;border-radius:16px;min-height:48px;font-weight:700;font-size:.98rem;cursor:pointer;transition:transform .15s}
.nav button:active{transform:scale(.97)}
.nav button:focus-visible{outline:3px solid var(--grn);outline-offset:2px}
.back{background:#E1E9E6;color:var(--ink)}
.next{background:var(--ink);color:#fff;font-family:var(--disp)}
.nav button:disabled{opacity:.35;cursor:default}
.badge{display:flex;align-items:center;gap:8px;border-radius:12px;padding:9px 12px;font-size:.84rem;margin-top:12px;cursor:pointer;border:1.5px solid}
.badge.ok{background:var(--gbg);border-color:var(--grn);color:var(--grnd)}
.badge.ok b{color:var(--ink)}
.badge.std{background:#EEF3F1;border-color:#C9D3D0}
.checks{display:none;font-size:.83rem;line-height:1.7;padding:8px 12px 0;color:var(--muted)}
.checks.on{display:block}
.hint{font-size:.74rem;color:var(--muted);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.person{opacity:1;transform:none}}
</style></head><body>
<div class="wrap">
  <div class="sum" id="sum"></div>
  <div class="steps" id="chips"></div>
  <div class="stage" id="stage"></div>
  <div id="navbox"><div class="nav"><button class="back" id="back">Back</button><button class="next" id="next">Next</button></div>
  <div class="hint">Tap a <span style="border-bottom:2px dotted #009E73;font-weight:600">dotted word</span> for its plain meaning. Arrow keys work too.</div></div>
</div>
<div class="tip" id="tip"></div>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const in10 = x => x <= 0 ? 0 : x >= 1 ? 10 : Math.min(9, Math.max(1, Math.round(x * 10)));
const share = k => k === 10 ? "all of them" : k === 0 ? "none of them" : `about ${k} in 10`;

/* ---------- glossary: plain meanings, longest match first ---------- */
const G = D.glossary;
const keys = Object.keys(G).sort((a, b) => b.length - a.length);
const rx = new RegExp("(" + keys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
function gloss(text, seen = new Set()) {
  return esc(text).replace(rx, m => {
    const k = keys.find(k => k.toLowerCase() === m.toLowerCase());
    if (!k || seen.has(k)) return m;
    seen.add(k);
    return `<button class="term" data-k="${esc(k)}">${m}</button>`;
  });
}
const tip = $("#tip");
document.addEventListener("click", e => {
  const t = e.target.closest(".term");
  if (!t) { tip.classList.remove("on"); return; }
  e.stopPropagation();
  const k = t.dataset.k, r = t.getBoundingClientRect();
  tip.innerHTML = `<b>${esc(k)}</b><br>${esc(G[k])}`;
  tip.classList.add("on");
  const w = Math.min(260, window.innerWidth - 20);
  tip.style.maxWidth = w + "px";
  tip.style.left = Math.max(10, Math.min(r.left, window.innerWidth - w - 10)) + "px";
  const below = r.bottom + 8, h = tip.offsetHeight;
  tip.style.top = (below + h > window.innerHeight ? r.top - h - 8 : below) + "px";
});

/* ---------- summary with count-up ---------- */
const S = D.summary;
$("#sum").classList.toggle("upc", S.val >= S.inv);
$("#sum").innerHTML = `<div class="who">${esc(S.who)}</div>
  <div class="loss"><span class="v ${S.dir}" data-n="${Math.abs(S.val - S.inv)}" data-s="${S.val < S.inv ? "−" : S.val > S.inv ? "+" : ""}">₹0</span>
  <span class="lbl">${S.val < S.inv ? "less than you put in" : S.val > S.inv ? "more than you put in" : "the same as you put in"}</span></div>
  <div class="row"><div><small>You put in</small><span class="v" data-n="${S.inv}">₹0</span></div>
  <div><small>Worth today</small><span class="v" data-n="${S.val}">₹0</span></div></div>
  <div class="foot">${esc(S.foot)}</div>`;
if (D.banner) $("#sum").insertAdjacentHTML("afterend", `<div class="banner">${esc(D.banner)}</div>`);
const fmt = n => "₹" + Math.round(n).toLocaleString("en-IN");
document.querySelectorAll(".sum .v").forEach(el => {
  const n = +el.dataset.n, s = el.dataset.s || "", t0 = performance.now();
  const tick = t => { const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3);
    el.textContent = s + fmt(n * e); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
});

/* ---------- step builders ---------- */
const how = t => t ? `<details class="how"><summary>How was this calculated?</summary><div>${esc(t)}</div></details>` : "";
const person = (cls, i) => `<svg class="person ${cls}" style="animation-delay:${i * 60}ms" viewBox="0 0 26 34"><circle cx="13" cy="8" r="6.5"/><path d="M2 33c0-8 4.8-13 11-13s11 5 11 13z"/></svg>`;
function people(k, cls, rare) { let h = ""; for (let i = 0; i < 10; i++) h += person(i < k ? cls : (rare && i === 0 ? "faint" : ""), i); return `<div class="people">${h}</div>`; }

function step1() {
  const v = D.normal;
  let vis = "";
  if (v.k !== null) vis = people(v.k, v.cls, v.rare) + `<div class="cap">${esc(v.cap)}</div>`;
  return `<div class="q">Step 1 of 4</div><h2>Is this normal for my stage?</h2>${vis}<p class="a">${gloss(D.answer.normal, new Set())}</p>${how(D.method.s1)}`;
}

function step2() {
  const c = D.compare, seen = new Set();
  let vis = "";
  if (c.rows.length) {
    const big = Math.max(...c.rows.map(r => Math.abs(r.gain))) || 1;
    vis = `<div class="bars">` + c.rows.map((r, i) => {
      const w = Math.max(0.8, Math.abs(r.gain) / big * 50);
      return `<div class="br"><div class="t"><span>${gloss(r.label, seen)}</span><b style="color:${r.gain < 0 ? "var(--verd)" : "var(--grnd)"}">${r.gain < 0 ? "−" : "+"}${fmt(Math.abs(r.gain))}</b></div>
        <div class="track"><div class="fill" data-w="${w}" data-l="${r.gain < 0 ? 50 - w : 50}" style="left:50%;background:${r.you ? (r.gain < 0 ? "var(--ver)" : "var(--grn)") : "#8FA3A0"}"></div><div class="mid"></div></div></div>`;
    }).join("") + `<div class="legend"><span>below what you put in</span><span>above it</span></div></div>
    <div class="cap">The dark centre line is what you put in (${fmt(D.summary.inv)}).</div>`;
  }
  return `<div class="q">Step 2 of 4</div><h2>Is it the market or my fund?</h2>${vis}<p class="a">${gloss(D.answer.market_or_fund, seen)}</p>${how(D.method.s2)}`;
}

function step3() {
  const P = D.paths;
  let vis = "";
  if (P && P.paths.length) {
    vis = `<div class="tm"><div class="cap" style="font-weight:700;color:var(--ink)">Time machine: past SIPs, not a forecast</div>
      <svg id="tmsvg" viewBox="0 0 340 200" role="img" aria-label="Past SIPs over time"></svg>
      <div class="tmtop"><button class="play" id="play" aria-label="Play">▶</button>
      <input type="range" id="slider" min="1" max="${P.max_m}" value="${D.n}"><span class="mlabel" id="mlab"></span></div>
      <div class="pin">Past SIPs, not a forecast. The past can’t promise what happens next.</div>
      <div class="seg" id="seg"><button data-v="red" class="on">Red at month ${D.n}, like yours</button><button data-v="all">All past SIPs</button></div>
      <div class="read" id="read"></div>
      <div class="cap" style="margin-top:6px">Each faint line is a SIP started in a different month since ${P.since}, run on the real prices of ${esc(P.series)}. <span style="color:var(--grnd);font-weight:700">Green</span> means above what was put in at that month, <span style="color:var(--verd);font-weight:700">orange</span> means below. The dark line is you.</div></div>`;
  }
  return `<div class="q">Step 3 of 4</div><h2>What does patience look like?</h2>${vis}<p class="a">${gloss(D.answer.patience)}</p>${how(D.method.s3)}`;
}

function step4() {
  const seen = new Set();
  const icons = ['<svg viewBox="0 0 20 20"><path d="M3 4l7 6-7 6zM10 4l7 6-7 6z" fill="#00704F"/></svg>',
    '<svg viewBox="0 0 20 20"><path d="M3 6h14M3 14h14" stroke="#0E2A2B" stroke-width="2"/><circle cx="7" cy="6" r="2.6" fill="#fff" stroke="#0E2A2B" stroke-width="2"/><circle cx="13" cy="14" r="2.6" fill="#fff" stroke="#0E2A2B" stroke-width="2"/></svg>',
    '<svg viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" rx="2" fill="#A84700"/></svg>'], tints = ["var(--gbg)", "#E8EEEC", "var(--vbg)"];
  const C = D.compare_choices;
  const table = `<table class="cmp"><tr><th></th>${C.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>` +
    C.rows.map(r => `<tr><td>${esc(r[0])}</td>${r.slice(1).map(v => `<td${v.startsWith("!") ? ' class="warn"' : ""}>${esc(v.replace(/^!/, ""))}</td>`).join("")}</tr>`).join("") + `</table>`;
  return `<div class="q">Step 4 of 4</div><h2>What can I do?</h2><div class="cap">Shown side by side so you can see what each one does. None of them is a suggestion, and staying as you are is a choice too.</div>
    <div class="afford">${esc(D.afford)}</div>${table}` +
    D.options.map((o, i) => `<div class="opt"><button aria-expanded="false"><span class="ic" style="background:${tints[i]}">${icons[i]}</span>
      <span><div class="tt">${esc(o.t)}</div><div class="sub">${esc(o.short)}</div></span><span class="chev">›</span></button>
      <div class="body"><div>${gloss(o.what, seen)}</div><div class="cap" style="margin-top:6px">${esc(o.note)}</div></div></div>`).join("") +
    `<div class="cap" style="margin-top:8px">${esc(D.options_note)}</div>`;
}

/* ---------- time machine drawing ---------- */
let filt = "red", month = D.n, playing = null;
function drawTM() {
  const P = D.paths, svg = $("#tmsvg"); if (!svg) return;
  const W = 340, H = 200, L = 30, R = 8, T = 10, B = 22;
  let set = P.paths.filter(p => p.p.length >= D.n);
  if (filt === "red") set = set.filter(p => p.p[D.n - 1] < 0);
  const vals = set.flatMap(p => p.p).concat(P.you.filter(v => v !== null)).sort((a, b) => a - b);
  const q = f => vals.length ? vals[Math.floor(f * (vals.length - 1))] : 0;
  let lo = Math.min(-10, q(0.02)), hi = Math.max(10, q(0.98));
  const x = m => L + (m - 1) / (P.max_m - 1) * (W - L - R);
  const y = v => T + (hi - Math.max(lo, Math.min(hi, v))) / (hi - lo) * (H - T - B);
  let g = `<rect x="${L}" y="${T}" width="${W - L - R}" height="${y(0) - T}" fill="#009E73" opacity=".07"/>
    <rect x="${L}" y="${y(0)}" width="${W - L - R}" height="${H - B - y(0)}" fill="#D55E00" opacity=".05"/>`;
  [lo, 0, hi].forEach(t => g += `<text x="${L - 4}" y="${y(t) + 3}" font-size="8" text-anchor="end" fill="#5C6F6E">${t > 0 ? "+" : ""}${Math.round(t)}%</text>`);
  [1, 12, 24, 36, 48, 60].filter(m => m <= P.max_m).forEach(m => g += `<text x="${x(m)}" y="${H - 8}" font-size="8" text-anchor="middle" fill="#5C6F6E">m${m}</text>`);
  set.forEach(p => {
    const k = Math.min(month, p.p.length); if (k < 1) return;
    const pts = p.p.slice(0, k).map((v, i) => `${x(i + 1).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const last = p.p[k - 1];
    g += `<polyline points="${pts}" fill="none" stroke="${last >= 0 ? "#009E73" : "#D55E00"}" stroke-width="1" opacity="${set.length > 60 ? .22 : .38}"/>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#0E2A2B" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="${W - R}" y="${y(0) - 4}" font-size="8" text-anchor="end" fill="#0E2A2B" font-weight="700">what was put in</text>`;
  g += `<line x1="${x(month)}" x2="${x(month)}" y1="${T}" y2="${H - B}" stroke="#0E2A2B" stroke-width="1" opacity=".5"/>`;
  const you = P.you.map((v, i) => v === null ? null : [x(i + 1), y(v)]).filter(Boolean);
  if (you.length > 1) g += `<polyline points="${you.map(p => p.join(",")).join(" ")}" fill="none" stroke="#0E2A2B" stroke-width="3" stroke-linejoin="round"/>`;
  if (you.length) { const e = you[you.length - 1];
    g += `<circle cx="${e[0]}" cy="${e[1]}" r="5" fill="#0E2A2B" stroke="#fff" stroke-width="2"/><text x="${e[0] + 7}" y="${e[1] + 3}" font-size="9" font-weight="800" fill="#0E2A2B">You</text>`; }
  svg.innerHTML = g;
  const at = set.filter(p => p.p.length >= month);
  const up = at.filter(p => p.p[month - 1] > 0).length;
  $("#mlab").textContent = `Month ${month}`;
  if (!at.length) { $("#read").innerHTML = `Not enough history to show month ${month}.`; return; }
  const who = filt === "red" ? `past SIPs that were in the red at month ${D.n} (by any amount)` : `all past SIPs`;
  $("#read").innerHTML = month === D.n && filt === "red" ? `These are the ${at.length} ${who}. Press ▶ to see where they were later.`
    : `At <b>month ${month}</b>, ${in10(up / at.length) === 10 ? `all ${at.length}` : `${share(in10(up / at.length))} of the ${at.length}`} ${who} were <b>above</b> what was put in.`;
}
function bindTM() {
  const s = $("#slider"); if (!s) return;
  s.oninput = () => { month = +s.value; stop(); drawTM(); };
  $("#seg").onclick = e => { const b = e.target.closest("button"); if (!b) return; filt = b.dataset.v;
    document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b)); drawTM(); };
  $("#play").onclick = () => playing ? stop() : play();
  drawTM();
}
function stop() { clearInterval(playing); playing = null; const b = $("#play"); if (b) b.textContent = "▶"; }
function play() {
  const s = $("#slider"); if (month >= D.paths.max_m) month = D.n;
  $("#play").textContent = "❚❚";
  playing = setInterval(() => { month++; s.value = month; drawTM(); if (month >= D.paths.max_m) stop(); }, 140);
}

/* ---------- stepper ---------- */
const STEPS = [["1", "Normal?", step1], ["2", "Market or fund?", step2], ["3", "Patience", step3], ["4", "My choices", step4]];
let cur = 0; const seenTM = { done: false };
$("#chips").innerHTML = `<i class="prog" id="prog"></i>` + STEPS.map((s, i) => `<button class="chip" data-i="${i}" aria-label="Step ${s[0]}: ${s[1]}"><span class="n">${s[0]}</span>${s[1]}</button>`).join("");
$("#stage").innerHTML = STEPS.map((s, i) => `<div class="card" id="c${i}">${s[2]()}${i < 3 ? badge() : ""}</div>`).join("");
function badge() {
  const ok = D.source === "ai";
  return `<div class="badge ${ok ? "ok" : "std"}" role="button" tabindex="0" onclick="this.nextElementSibling.classList.toggle('on')"><span>${ok ? "✓ <b>Checked answer.</b> Numbers match your data, no advice, plain words." : "<b>Standard answer.</b> Built directly from your numbers."}</span><span style="margin-left:auto">ⓘ</span></div>
    <div class="checks">${D.checks.map(c => `${c.ok ? "✓" : "✗"} ${esc(c.name)}`).join("<br>")}${D.source === "ai" ? "<br>The AI wrote this answer, then automatic rules checked it before you saw it. A person didn’t review it, and it isn’t advice." : "<br>The AI’s wording didn’t pass every check (or was unavailable), so this is the standard answer, built straight from your numbers."}</div>`;
}
function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i)); stop();
  document.querySelectorAll(".card").forEach((c, j) => c.classList.toggle("show", j === cur));
  document.querySelectorAll(".chip").forEach((c, j) => { c.classList.toggle("on", j === cur); c.classList.toggle("done", j < cur); });
  { const cs = document.querySelectorAll(".chip"), a = cs[0].getBoundingClientRect(), b = cs[cur].getBoundingClientRect();
    $("#prog").style.width = Math.max(0, b.left - a.left) + "px"; }
  $("#back").disabled = cur === 0;
  $("#next").textContent = cur === STEPS.length - 1 ? "Start again" : "Next";
  const card = $("#c" + cur);
  card.appendChild($("#navbox"));
  card.querySelectorAll(".person").forEach(p => { p.style.animation = "none"; p.offsetHeight; p.style.animation = ""; });
  setTimeout(() => card.querySelectorAll(".fill").forEach(f => { f.style.left = f.dataset.l + "%"; f.style.width = f.dataset.w + "%"; }), 60);
  if (cur === 2) { bindTM(); if (!seenTM.done && D.paths && !matchMedia("(prefers-reduced-motion: reduce)").matches) { seenTM.done = true; setTimeout(play, 700); } }
}
$("#chips").onclick = e => { const b = e.target.closest(".chip"); if (b) go(+b.dataset.i); };
$("#back").onclick = () => go(cur - 1);
$("#next").onclick = () => go(cur === STEPS.length - 1 ? 0 : cur + 1);
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });
$("#stage").addEventListener("click", e => { const b = e.target.closest(".opt > button"); if (!b) return;
  const o = b.parentElement; o.classList.toggle("open"); b.setAttribute("aria-expanded", o.classList.contains("open")); });
let sx = null;
$("#stage").addEventListener("touchstart", e => { if (e.target.closest(".tm")) return; sx = e.touches[0].clientX; }, { passive: true });
$("#stage").addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 60) go(cur + (dx < 0 ? 1 : -1)); });
go(0);
// round-3 user test (P3): the result loaded below the screen. Scroll it into view once per new result.
(function () {
  try {
    const sig = JSON.stringify(D.summary), ss = window.parent.sessionStorage;
    if (ss.getItem("sip_last_result") !== sig) {
      ss.setItem("sip_last_result", sig);
      const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      setTimeout(() => window.frameElement && window.frameElement.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" }), 350);
    }
  } catch (e) { /* the frame cannot reach the page: leave the scroll to the user */ }
})();
</script></body></html>
