<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIP Discovery Engine</title>
<meta name="description" content="Why first-time mutual fund investors stop their SIPs — 100k+ public conversations, AI-coded and validated against a hand-labelled golden set. Research only, not investment advice.">
<meta property="og:title" content="SIP Discovery Engine">
<meta property="og:description" content="Why first-time investors stop their SIPs — AI-coded public conversations, validated against human labels.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230072B2'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --line:#e3e6ea;
  --ink:#101418; --ink-2:#47505a; --ink-3:#66707c;
  --accent:#0072B2; --accent-soft:#e6f1f8; --accent-ink:#005a8c;
  --bar:#0072B2; --bar-dim:#a9cde4; --muted-bar:#c3c9d1;
  --orange:#E69F00; --verm:#D55E00; --green:#009E73; --sky:#56B4E9; --pink:#CC79A7;
  --good:#00704f; --good-bg:#e2f4ee; --warn:#8a5700; --warn-bg:#fdf1d8; --bad:#a94400; --bad-bg:#fbe7dc;
  --shadow:0 1px 2px rgba(16,20,24,.04),0 4px 16px rgba(16,20,24,.06);
  --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:99}
.skip:focus{left:8px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand .dot{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{color:var(--ink-2);text-decoration:none;font-size:15px;font-weight:500;padding:8px 12px;border-radius:999px;white-space:nowrap}
.links a:hover{background:var(--surface-2);color:var(--ink)}
.links a.on{background:var(--ink);color:#fff}
.navcta{flex:none;font-size:15px;font-weight:600;text-decoration:none;color:#fff;background:var(--accent);padding:8px 14px;border-radius:10px}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
@media (max-width:980px){.links{display:none}.navcta{margin-left:auto}}
@media (max-width:640px){.nav .wrap{height:56px}}

/* hero */
.hero{padding:64px 0 32px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:6px 12px;border-radius:999px}
.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.07;letter-spacing:-.028em;margin:18px 0;max-width:940px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:clamp(17px,2vw,20px);color:var(--ink-2);max-width:760px;margin:0 0 28px}
.ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:16px;padding:12px 20px;border-radius:12px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3)}
.status-line{font-size:14px;color:var(--ink-3);display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:18px}
.status-line span{display:inline-flex;align-items:center;gap:6px}
.status-line i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}

.funnel{margin-top:40px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.step{padding:22px 20px;position:relative}
.step+.step{border-left:1px solid var(--line)}
.step+.step::before{content:"";position:absolute;left:-7px;top:34px;width:12px;height:12px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:rotate(45deg)}
.step .n{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.step .l{font-size:14px;color:var(--ink-2);line-height:1.4;margin-top:4px}
.step .meter{height:6px;border-radius:3px;background:var(--surface-2);margin-top:14px;overflow:hidden}
.step .meter i{display:block;height:100%;background:var(--bar);border-radius:3px;min-width:3px}
.step.key{background:var(--accent-soft)}
.step.key::before{background:var(--accent-soft)}
.step.key .n{color:var(--accent-ink)}
.sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.src{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 8px}
@media (max-width:900px){.funnel{grid-template-columns:1fr 1fr}.step+.step{border-left:none}.step+.step::before{display:none}.step{border-top:1px solid var(--line)}.step:nth-child(-n+2){border-top:none}.step:nth-child(even){border-left:1px solid var(--line)}.step.key{grid-column:1/-1;border-left:none}}

/* sections */
section.block{padding:80px 0 8px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.eyebrow b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;font-size:13px;letter-spacing:0}
h2{font-size:clamp(26px,3.4vw,38px);line-height:1.15;letter-spacing:-.022em;margin:10px 0 12px;max-width:860px;font-weight:800}
.sub{color:var(--ink-2);font-size:18px;max-width:780px;margin:0 0 30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;min-width:0}
.card h3{font-size:18px;margin:0 0 4px;letter-spacing:-.01em;line-height:1.35}
.hint{font-size:14px;color:var(--ink-3);margin:0 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mt{margin-top:20px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.insight{display:flex;gap:14px;align-items:flex-start;margin-top:20px;padding:16px 18px;border-radius:12px;background:var(--accent-soft)}
.insight svg{flex:none;color:var(--accent-ink);margin-top:3px}
.caveat{font-size:14px;color:var(--ink-3);margin:12px 0 0}
details.table{margin-top:14px;font-size:14px}
details.table summary{cursor:pointer;color:var(--accent-ink);font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.table summary::-webkit-details-marker{display:none}
details.table summary::before{content:"▸";transition:transform .15s}
details[open].table summary::before{transform:rotate(90deg)}
.dt{width:100%;border-collapse:collapse;margin-top:10px}
.dt th,.dt td{text-align:left;padding:7px 8px;border-top:1px solid var(--line)}
.dt th{color:var(--ink-3);font-weight:600;border-top:none}
.dt td.r,.dt th.r{text-align:right;font-variant-numeric:tabular-nums}

/* context stats */
.stat .big{font-size:clamp(34px,4vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat p{margin:8px 0 0;color:var(--ink-2)}
.stat .src-l{font-size:13px;color:var(--ink-3);margin-top:12px;display:block}
.stat.goal{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat.goal .big{color:#fff;font-size:clamp(22px,2.4vw,28px)}
.stat.goal p,.stat.goal .src-l{color:#c8cdd3}

/* why */
.why{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}
@media (max-width:900px){.why{grid-template-columns:1fr}}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:minmax(150px,210px) 1fr 52px;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.barrow:hover{background:var(--surface-2)}
.barrow[aria-pressed="true"]{background:var(--accent-soft);border-color:#b8d6ea}
.barrow .name{font-size:15px;font-weight:600;line-height:1.3}
.track{height:22px;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--bar-dim);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1),background .2s}
.barrow[aria-pressed="true"] .track i,.barrow:hover .track i{background:var(--bar)}
.pct{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:560px){.barrow{grid-template-columns:1fr 48px;row-gap:6px}.barrow .track{grid-column:1/-1;grid-row:2}}
.panel{position:sticky;top:86px}
.panel .big{font-size:40px;font-weight:800;letter-spacing:-.02em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.panel .big small{font-size:16px;color:var(--ink-3);font-weight:600}
.quote{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--surface)}
.quote p{margin:0 0 10px;font-size:16px;line-height:1.5}
.quote p::before{content:"“";color:var(--accent);font-weight:800;margin-right:2px}
.quote p::after{content:"”";color:var(--accent);font-weight:800;margin-left:1px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.tag{font-size:13px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2)}
.meta a{margin-left:auto;font-weight:600;text-decoration:none}
.meta a:hover{text-decoration:underline}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--good);font-weight:600}
.stack{display:flex;height:42px;border-radius:10px;overflow:hidden;gap:2px}
.stack span{display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--ink-2)}
.legend b{color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.window{display:flex;gap:20px;align-items:center}
.ring{flex:none;width:120px;height:120px}
.window .big{font-size:44px;font-weight:800;letter-spacing:-.02em;color:var(--accent-ink);line-height:1}
.minirows{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.minirow{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.minirow .t{height:10px;background:var(--surface-2);border-radius:3px;position:relative;overflow:hidden}
.minirow .t i{position:absolute;inset:0 auto 0 0;background:var(--bar);border-radius:0 3px 3px 0}
.minirow .t i.dim{background:var(--muted-bar)}
.minirow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* who */
.seg{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.segrow{display:grid;grid-template-columns:1fr 64px;gap:4px 12px;align-items:center}
.segrow .lab{font-size:15px;font-weight:600}
.segrow .lab small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:6px}
.segrow .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.segrow .t{grid-column:1/-1;height:12px;background:var(--surface-2);border-radius:3px;position:relative}
.segrow .t i{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0;background:var(--bar-dim)}
.segrow.hi .t i{background:var(--bar)}
.segrow .t b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.baseline-key{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.baseline-key b{display:inline-block;width:2px;height:14px;background:var(--ink)}

/* where */
.channels{display:flex;flex-direction:column;gap:10px}
.ch{display:grid;grid-template-columns:30px 170px 1fr 54px;gap:10px;align-items:center}
.ch .ic{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.ch .lab{font-weight:600;font-size:15px}
.ch .t{height:14px;background:var(--surface-2);border-radius:3px;position:relative}
.ch .t i{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0;background:var(--bar)}
.ch.dim .t i{background:var(--bar-dim)}
.ch .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:560px){.ch{grid-template-columns:30px 1fr 50px}.ch .t{grid-column:2/-1;grid-row:2}}
.bigstat{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent-ink);font-variant-numeric:tabular-nums}

/* opportunity */
.opp{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:900px){.opp{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:inherit}
.rank{display:flex;flex-direction:column;gap:12px}
.rk{display:grid;grid-template-columns:28px 1fr 56px;gap:10px;align-items:center}
.rk .no{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.rk.top .no{background:var(--accent);color:#fff}
.rk .lab{font-weight:600;line-height:1.3}
.rk .lab small{display:block;font-weight:400;color:var(--ink-3);font-size:13px}
.rk .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* trust */
.trust{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:900px){.trust{grid-template-columns:1fr}}
.score{width:100%;border-collapse:collapse}
.score th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;font-weight:600;padding:0 8px 10px}
.score td{padding:14px 8px;border-top:1px solid var(--line);vertical-align:middle}
.score .q{font-weight:600}
.score .q small{display:block;font-weight:400;color:var(--ink-3);font-size:14px}
.score .num{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{height:6px;border-radius:3px;background:var(--surface-2);position:relative;margin-top:6px;width:110px}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink-3)}
.mini b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.status.good{color:var(--good);background:var(--good-bg)}
.status.warn{color:var(--warn);background:var(--warn-bg)}
.status.bad{color:var(--bad);background:var(--bad-bg)}
.status.info{color:var(--ink-2);background:var(--surface-2)}
.fix{font-size:14px;color:var(--ink-2);margin-top:6px;font-weight:400}
@media (max-width:560px){
  .score .hide-s{display:none}.score thead{display:none}
  .score tr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
  .score td{border:none;padding:0}.score td.q{grid-column:1/-1}.mini{width:140px}
}
.gates{display:flex;flex-direction:column;gap:16px}
.gate{display:flex;gap:14px;align-items:flex-start}
.gate .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.gate b{display:block}
.gate span{font-size:14px;color:var(--ink-2)}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp th,.cmp td{padding:10px 8px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
.cmp th{border-top:none;font-size:13px;color:var(--ink-3);font-weight:600}
.cmp td.c{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.cmp .ok{color:var(--good)} .cmp .no{color:var(--bad)}
.scroll-x{overflow-x:auto}
.case{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.case .txt{font-size:15px;color:var(--ink-2);margin:0;line-height:1.5}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;align-items:center}
.strike{text-decoration:line-through;color:var(--bad);font-weight:600}
.right{color:var(--good);font-weight:700}

/* how */
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;counter-reset:s}
.pst{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);position:relative}
.pst .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:14px}
.pst h4{margin:0 0 6px;font-size:16px}
.pst p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.5}
.pst .n{display:block;margin-top:12px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.pst .n small{font-size:13px;font-weight:500;color:var(--ink-3)}
.pst:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:30px;color:var(--ink-3);font-weight:700;z-index:2;background:var(--bg);width:12px;text-align:center}
@media (max-width:980px){.pipe{grid-template-columns:1fr 1fr}.pst::after{display:none}}
@media (max-width:560px){.pipe{grid-template-columns:1fr}}
.stackchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.stackchips span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}

/* try */
.try{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
@media (max-width:900px){.try{grid-template-columns:1fr}}
.input{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:12px;padding:16px;margin:0}
.input mark{background:#ffe7a8;color:inherit;border-radius:3px;padding:0 2px}
.labels{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:start;font-size:15px}
.labels dt{color:var(--ink-3);font-weight:500}
.labels dd{margin:0;font-weight:600;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.pill.risk{background:var(--bad-bg);color:var(--bad)}
.labcta{margin-top:22px;padding:18px;border-radius:12px;background:var(--ink);color:#fff;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.labcta p{margin:0;color:#c8cdd3;font-size:14px}
.labcta b{color:#fff;font-size:16px}
.labcta .btn{background:#fff;color:var(--ink)}

/* next */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.flow{grid-template-columns:1fr}}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.fc .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fc p{margin:8px 0 0;font-size:17px;line-height:1.5}
.fc.hyp{border:2px dashed #9fc6e0;background:#f7fbfe}

footer{padding:64px 0 72px;color:var(--ink-3);font-size:14px}
footer .row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px;border-top:1px solid var(--line);padding-top:28px}
footer h5{color:var(--ink);font-size:14px;margin:0 0 8px}
footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
footer a{color:var(--ink-2)}
@media (max-width:800px){footer .row{grid-template-columns:1fr}}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:#5c3b00;border-radius:12px;padding:12px 14px;font-size:14px}

.tip{position:fixed;pointer-events:none;z-index:40;background:var(--ink);color:#fff;font-size:13px;line-height:1.4;padding:8px 10px;border-radius:8px;max-width:270px;opacity:0;transition:opacity .12s}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
.loading{padding:120px 0;text-align:center;color:var(--ink-3)}
/* key takeaways */
.tldr{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.tk:hover{border-color:#9fc6e0;transform:translateY(-2px)}
.tk .no{font-size:13px;font-weight:700;color:var(--accent-ink)}
.tk b{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.tk span{font-size:15px;color:var(--ink-2);line-height:1.45}
.tk em{font-style:normal;margin-top:auto;font-size:14px;font-weight:600;color:var(--accent-ink)}
@media (max-width:900px){.tldr{grid-template-columns:1fr 1fr}}
/* mobile section menu */
.mnav{display:none;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 16px 10px;margin:0 -16px;-webkit-overflow-scrolling:touch}
.mnav::-webkit-scrollbar{display:none}
.mnav a{flex:none;font-size:14px;font-weight:600;color:var(--ink-2);text-decoration:none;background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;min-height:38px;display:inline-flex;align-items:center}
.mnav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (max-width:980px){.mnav{display:flex}}
.grid-where{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.cmp-m{display:none}
/* phones */
@media (max-width:640px){
  body{font-size:16px}
  .hero{padding:36px 0 20px}
  .hero h1{font-size:31px}
  .lede{font-size:17px}
  .ctas .btn{flex:1 1 100%;justify-content:center}
  section.block{padding:56px 0 4px}
  h2{font-size:25px}
  .sub{font-size:16px;margin-bottom:22px}
  .card{padding:18px}
  .tldr{grid-template-columns:1fr;gap:10px}
  .tk{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:14px 16px}
  .tk b{font-size:24px}.tk span{flex:1 1 60%}.tk em,.tk .no{display:none}
  .grid-where{grid-template-columns:1fr}
  .src,.tag{font-size:13px}
  .meta a,details.table summary,.stat .src-l a,.caveat a,footer a{display:inline-flex;align-items:center;min-height:40px}
  details.table summary{padding:6px 0}
  .ch{grid-template-columns:30px 1fr 50px}.ch .lab{font-size:15px}
  .bigstat{font-size:48px}
  .window{gap:14px}.ring{width:92px;height:92px}.window .big{font-size:38px}
  .minirow{grid-template-columns:1fr 70px 40px}
  /* swipeable rows instead of very long stacks */
  .pipe,.cases{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -16px;padding:4px 16px 14px;scrollbar-width:none}
  .pipe::-webkit-scrollbar,.cases::-webkit-scrollbar{display:none}
  .pipe>.pst,.cases>.case{flex:0 0 82%;scroll-snap-align:start}
  .swipe-hint{display:block!important}
  .cmp-d{display:none}.cmp-m{display:block}
  footer .row{gap:18px}
}
.swipe-hint{display:none;font-size:13px;color:var(--ink-3);margin:-4px 0 8px}
.cmp-m .mrow{border-top:1px solid var(--line);padding:12px 0}
.cmp-m .mrow b{display:block;margin-bottom:6px}
.cmp-m .mrow div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;color:var(--ink-2)}
.cmp-m .ok{color:var(--good);font-weight:700}.cmp-m .no{color:var(--bad);font-weight:700}

<script>

const section = (id, n, eyebrow, title, sub, body) => `<section class="block reveal" id="${id}" aria-labelledby="${id}-h">

function wire(D){
  /* cluster bars + quote panel */
  const bars = document.getElementById("bars"), panel = document.getElementById("panel"), ed = D.funnel.early_drops;
  const MAXC = Math.max(...D.clusters.map(c=>c.pct)) * 1.08;
  const show = i => {
    [...bars.children].forEach((b,j)=>b.setAttribute("aria-pressed", i===j));
    const c = D.clusters[i];
    panel.innerHTML = `<h3>${esc(c.name)}</h3><div class="big">${c.pct}% <small>· ${fmt(c.n)} moments</small></div><p class="hint" style="margin:4px 0 4px">${esc(c.desc)}</p>
      ${c.quotes.map(q=>`<div class="quote"><p>${esc(q.text)}</p><div class="meta"><span class="tag">${esc(q.source)}</span><span class="tag">${esc(q.emotion)}</span><span class="verified" title="Found word-for-word in the original post">✓ verified</span><a href="${esc(q.url)}" target="_blank" rel="noopener">Source ↗</a></div></div>`).join("")}
      ${c.quotes.length ? `<p class="caveat">Play Store reviews have no per-review link, so they open the app’s review page.</p>` : ""}`;
  };
  D.clusters.forEach((c,i) => {
    const b = document.createElement("button");
    b.className = "barrow"; b.type = "button";
    b.setAttribute("aria-label", `${c.name}: ${c.pct}% of drop-off moments. Show quotes.`);
    b.innerHTML = `<span class="name">${esc(c.name)}</span><span class="track"><i data-w="${100*c.pct/MAXC}"></i></span><span class="pct">${r0(c.pct)}%</span>`;
    b.onclick = () => show(i);
    tipOn(b, `${c.name} — ${c.pct}% (${fmt(c.n)} of ${fmt(ed)}). Click to read quotes.`);
    bars.appendChild(b);
  });
  show(0);

  /* emotion stack */
  const EC = ["#0072B2","#8a939e","#D55E00","#E69F00","#CC79A7","#56B4E9"], stack = document.getElementById("stack");
  D.emotion.forEach(([n,p],i) => {
    const s = document.createElement("span"); s.style.flex = p; s.style.background = EC[i];
    if (p >= 20) s.textContent = `${n} ${r0(p)}%`;
    if (i === 1 || i === 3) s.style.color = "#101418";
    tipOn(s, `${n}: ${p}% of drop-off moments`); stack.appendChild(s);
  });
  document.querySelectorAll("[data-tip]").forEach(el => tipOn(el, el.dataset.tip));

  /* bubble chart (redrawn on resize so labels stay readable) */
  drawBubble(D.themes);
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => drawBubble(D.themes), 200); });

  /* reveal + bar growth */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in");
    e.target.querySelectorAll("[data-w]").forEach(t => t.style.width = t.dataset.w + "%"); io.unobserve(e.target); } }), {threshold: 0, rootMargin: "0px 0px -8% 0px"});
  document.querySelectorAll(".reveal").forEach(s => io.observe(s));

  /* count-up */
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.querySelectorAll("[data-count]").forEach(el => { const end = +el.dataset.count, t0 = performance.now();
      const f = t => { const k = Math.min(1, (t - t0) / 1100); el.textContent = fmt(Math.round(end * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(f); };
      requestAnimationFrame(f); });
  }

  /* active nav + progress */
  const mnav = document.getElementById("mnav");
  mnav.innerHTML = [...document.querySelectorAll("#links a")].map(a=>`<a href="${a.getAttribute("href")}">${a.textContent}</a>`).join("") + `<a href="#try">Try it</a>`;
  const mlinks = [...mnav.querySelectorAll("a")];
  const links = [...document.querySelectorAll("#links a")], prog = document.getElementById("progress");
  const secs = links.map(a => document.querySelector(a.getAttribute("href")));
  const onScroll = () => {
    const y = scrollY + 120; let cur = -1;
    secs.forEach((s,i) => { if (s && s.offsetTop <= y) cur = i; });
    links.forEach((a,i) => a.classList.toggle("on", i === cur));
    mlinks.forEach((a,i) => { const on = i === cur; if (on && !a.classList.contains("on")) a.scrollIntoView({block:"nearest", inline:"center"}); a.classList.toggle("on", on); });
    prog.style.width = (100 * scrollY / Math.max(1, document.body.scrollHeight - innerHeight)) + "%";
  };
  addEventListener("scroll", onScroll, {passive: true}); onScroll();
  if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
}

function drawBubble(T){
  const el0 = document.getElementById("bubble");
  const W = Math.max(300, Math.min(680, el0.clientWidth || 640)), narrow = W < 480;
  const H = narrow ? 360 : 380, m = {l: narrow ? 52 : 58, r: narrow ? 10 : 20, t: 16, b: 46};
  const xmax = Math.ceil(Math.max(...T.map(t=>t.reach)) / 5) * 5 + 2, ymax = 100;
  const X = v => m.l + (W - m.l - m.r) * v / xmax, Y = v => H - m.b - (H - m.t - m.b) * v / ymax;
  const R = v => (narrow ? 5 : 6) + (narrow ? 11 : 16) * Math.sqrt(v / 100);
  const top = T.slice().sort((a,b)=>b.score-a.score).slice(0, narrow ? 3 : 5).map(t=>t.label);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Opportunity map: reach versus closeness to stopping for each reason">`;
  for (let v = 0; v <= ymax; v += 25) s += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-10}" y="${Y(v)+4}" text-anchor="end" font-size="13" fill="var(--ink-3)">${v}%</text>`;
  for (let v = 0; v <= xmax; v += (narrow ? 10 : 5)) s += `<text x="${X(v)}" y="${H-m.b+20}" text-anchor="middle" font-size="13" fill="var(--ink-3)">${v}%</text>`;
  s += `<text x="${(W+m.l-m.r)/2}" y="${H-6}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink-2)">Reach — % of all relevant posts →</text>`;
  s += `<text transform="translate(12 ${(H-m.b+m.t)/2}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink-2)">Tied to stopping →</text>`;
  const sorted = T.slice().sort((a,b)=>b.early-a.early);
  sorted.forEach(t => {
    const fix = t.addr >= .8, cx = X(t.reach), cy = Y(t.proximity), r = R(t.early);
    s += `<circle class="bub" cx="${cx}" cy="${cy}" r="${r}" fill="${fix ? "var(--bar)" : "#fff"}" fill-opacity="${fix ? .85 : 1}" stroke="${fix ? "#fff" : "var(--ink-3)"}" stroke-width="2"
      data-tip="${esc(t.label)} — ${t.reach}% reach, ${t.proximity}% tied to stopping, ${t.early}% first-year, fixability ${t.addr}, score ${t.score}"/>`;
  });
  const placed = [];
  T.filter(t => top.includes(t.label)).forEach(t => {
    let x = X(t.reach) + R(t.early) + 6, y = Y(t.proximity) + 4, anchor = "start";
    if (x > W - (narrow ? 120 : 150)) { x = X(t.reach) - R(t.early) - 6; anchor = "end"; }
    while (placed.some(p => Math.abs(p - y) < 15)) y += 15;
    placed.push(y);
    s += `<text x="${x}" y="${y}" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="${anchor}" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(t.label)}</text>`;
  });
  s += `</svg>`;
  const el = el0; el.innerHTML = s;
  el.querySelectorAll(".bub").forEach(c => tipOn(c, c.dataset.tip));
}

fetch("data.json", {cache: "no-store"}).then(r => r.json()).then(render).catch(e => {
  document.getElementById("main").innerHTML = `<div class="loading">Couldn’t load the results (${esc(e.message)}). Try refreshing, or open the <a href="${LIVE_LAB}">live lab</a>.</div>`;
});
</script>
</body>
